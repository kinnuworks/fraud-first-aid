name: scorecard
# OpenSSF Scorecard: an independent check of the repo's security practices (branch protection, pinned
# dependencies, token permissions, code review, and more), published as a public score and badge.
on:
  push:
    branches: [master]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:
permissions: read-all
jobs:
  analysis:
    # The Scorecard action and its public results need a public repo; it runs once the repo is public.
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@v2.4.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
