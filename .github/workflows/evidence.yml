name: evidence
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Recomputes every published number and interval from evidence/results and checks the README states it.
      - run: python3 -I evidence/verify.py
